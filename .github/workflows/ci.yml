name: ci
on: [push, pull_request]
jobs:
  python:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]"
      - run: python scripts/check_deps.py
      - run: ruff check traceaudit tests
      - run: pytest -q
      - run: traceaudit demo --out runs/ci-demo --runs 2 --B 100
      - run: traceaudit validate-probes --grid quick --out runs/ci-validate
  viewer:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: viewer } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test -- --run
      - run: npm run build
  nightly-validation:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - run: traceaudit validate-probes --grid default --out runs/nightly
      - uses: actions/upload-artifact@v4
        with: { name: validation, path: runs/nightly/validation.md }
